name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: prepare emits the git-install entrypoint
        run: |
          rm -rf dist
          npm run prepare
          test -f dist/index.js
          test -f dist/index.d.ts

  example-cloudflare:
    # Typechecks examples/salesforce-cloudflare against this repo's source.
    # Its dependencies stay out of the root package so installs from GitHub stay small.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/salesforce-cloudflare/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: examples/salesforce-cloudflare
      - run: npm run typecheck
        working-directory: examples/salesforce-cloudflare
