# Reusable job for deploy.yml: deploy one stage. Copy to .github/workflows/.
name: Salesforce deploy stage

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: deploy (${{ inputs.stage }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    env:
      STAGE: ${{ inputs.stage }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --global @salesforce/cli
      - name: Authorize the org (JWT)
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_CLIENT_ID: ${{ vars.SF_CLIENT_ID }}
          SF_USERNAME: ${{ vars.SF_USERNAME }}
          SF_LOGIN_URL: ${{ vars.SF_LOGIN_URL }}
        run: |
          printf '%s' "$SF_JWT_KEY" > "$RUNNER_TEMP/server.key"
          sf org login jwt --username "$SF_USERNAME" --client-id "$SF_CLIENT_ID" \
            --jwt-key-file "$RUNNER_TEMP/server.key" --instance-url "${SF_LOGIN_URL:-https://login.salesforce.com}" \
            --alias "$STAGE"
      - name: Deploy
        run: npx alchemy deploy --stage "$STAGE" --yes --no-input
